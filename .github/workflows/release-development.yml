name: Development Release

on:
  push:
    branches:
      - "develop"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read development version
        id: version
        run: |
          version="$(jq -r '.version // empty' custom_components/ha_organizer/manifest.json)"

          if [ -z "$version" ]; then
            echo "The integration manifest does not define a version." >&2
            exit 1
          fi

          version="${version%-dev}"
          echo "value=${version}-dev" >> "$GITHUB_OUTPUT"

      - name: Delete existing release
        run: |
          gh release delete "v${DEV_VERSION}" --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_VERSION: ${{ steps.version.outputs.value }}

      - name: Create or update tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "v${{ steps.version.outputs.value }}"
          git push origin --force "v${{ steps.version.outputs.value }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: "This is a development release from develop."
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
