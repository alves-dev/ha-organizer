name: Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - custom_components/ha_organizer/manifest.json

permissions:
  contents: write

concurrency:
  group: production-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "Production releases must run from main." >&2; exit 1; }
          version="$(jq -r '.version // empty' custom_components/ha_organizer/manifest.json)"
          test -n "${version}" || { echo "The integration manifest does not define a version." >&2; exit 1; }
          case "${version}" in *-dev*) echo "Development versions cannot be published: ${version}" >&2; exit 1;; esac
          tag="v${version}"
          git rev-parse "${tag}" >/dev/null 2>&1 && { echo "Local tag already exists: ${tag}" >&2; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1 && { echo "Remote tag already exists: ${tag}" >&2; exit 1; }
          awk -v heading="## [${version}] - " 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no release notes for ${version}." >&2; exit 1; }
          { echo "tag=${tag}"; echo "title=${tag}"; } >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "${{ steps.release.outputs.tag }}" -m "${{ steps.release.outputs.title }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary release notes
        if: always()
        run: rm -f release-notes.md
